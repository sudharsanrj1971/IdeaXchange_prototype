name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
          
      - name: Install dependencies
        run: |
          cd server
          npm ci
          
      - name: Lint
        run: |
          cd server
          npm run lint
          
      - name: Build
        run: |
          cd server
          npm run build
          
      - name: Test
        run: |
          cd server
          npm test
